defaults:
  - finetune_ixi_vessels_q256.yaml

# Node-type ablation. Preserve the 9,999 matched-pair budget and disable HNM.
experiment:
  name: finetune_ixi_vessels_q256_types

model:
  node_type:
    enabled: true

loss:
  enabled: [boxes, class, cardinality, nodes, edges, node_types]
  weights:
    node_types: 1.0
