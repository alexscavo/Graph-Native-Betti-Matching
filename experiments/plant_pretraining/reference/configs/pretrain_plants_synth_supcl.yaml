DATA:
    NUM_WORKERS: 4
    DIM: 3
    BATCH_SIZE: 32
    DATA_PATH: ""

    MIXED_SOURCE: False
    MIXED: True

    SOURCE_DATASET_NAME:
        - "roads"

    NUM_SOURCE_SAMPLES_BY_DATASET:
        roads: 25900

    SOURCE_DATA_PATHS:
        roads: "/data/scavone/20cities/patches_3d_wdeg2"

    TARGET_DATASET_NAME:
        - "syntheticMRI"

    NUM_TARGET_SAMPLES_BY_DATASET:
        syntheticMRI: 3800

    NUM_TARGET_SAMPLES: 0

    TARGET_DATA_PATHS:
        syntheticMRI: "/data/scavone/syntheticMRI/patches/syntheticMRI"

    TEST_DATA_PATHS:
        syntheticMRI: "/data/scavone/syntheticMRI/patches/syntheticMRI"

    DATASET: "mixed_synth_3d"
    IMG_SIZE: [64, 64, 64]
    PAD_SIZE: [5, 5, 5]
    GROWTH_RANGE: [5, 10]
    NUM_PATCH: 4
    INTERPOLATION: "bicubic"
    PIN_MEMORY: True
    SEED: 20

MODEL:
    DROP_PATH_RATE: 0.2
    RESUME: ""
    NUM_CLASSES: 2
    DROP_RATE: 0.1
    LABEL_SMOOTHING: 0.1
    ADAPTER: group

    PRE2D_BACKBONE:
        POSITION_EMBEDDING: sine
        BACKBONE: resnet101
        BACKBONE_INIT_WEIGHTS: ResNet101_Weights
        MASKS: False
        DILATION: False
        NUM_FEATURE_LEVELS: 1
        PADDING_MODE: constant
        MARK_PADDING: False

    ENCODER:
        TYPE: SE-RESNET
        CELL_SIZE: 8
        NAME: Squeeze-and-excite-resnet
        EMBED_DIM: 256
        PATCH_SIZE: [4, 4, 4]
        IN_CHANS: 1
        DEPTHS: [4, 4, 16, 4]
        STRIDES: [2, 2, 2, 2]

    DECODER:
        TYPE: def-DETR
        NAME: deformable_DETR
        HIDDEN_DIM: 552
        NHEADS: 6
        ENC_LAYERS: 4
        DEC_LAYERS: 4
        DIM_FEEDFORWARD: 1280
        DROPOUT: 0.0
        ACTIVATION: relu
        NUM_FEATURE_LEVELS: 1
        DEC_N_POINTS: 4
        ENC_N_POINTS: 4
        TWO_STAGE: False
        OBJ_TOKEN: 120
        RLN_TOKEN: 2
        DUMMY_TOKEN: 0
        RLN_ATTN: True

    MATCHER:
        NAME: "Hungarian"
        C_CLASS: 2
        C_NODE: 5

TRAIN:
    START_EPOCH: 0
    EPOCHS: 50
    WARMUP_EPOCHS: 1
    WEIGHT_DECAY: 0.0001
    BASE_LR: 0.00007
    DOMAIN_LR: 0.00007
    WARMUP_LR: 0.000000001
    MIN_LR: 5e-6
    CLIP_GRAD: 5.0
    AUTO_RESUME: True
    USE_CHECKPOINT: False
    TRAIN_ENCODER: True
    TRAIN_DECODER: True
    DOMAIN_WEIGHTING: [0.05, 0.95]
    IMAGE_ADVERSARIAL: True
    GRAPH_ADVERSARIAL: True
    CONSISTENCY_REGULARIZATION: True
    ALPHA_COEFF: 1.0

    UPSAMPLE_TARGET_DOMAIN: True
    COMPUTE_TARGET_GRAPH_LOSS: True
    EDGE_SAMPLING_MODE: "up"
    EDGE_SAMPLE_RATIO: 0.15
    EDGE_SAMPLE_RATIO_INTERVAL: 0.02

    NUM_EDGE_SAMPLES: 9999
    EDGE_UPSAMPLING: True

    USE_EMA: False
    EMA_DECAY: 0.995
    EMA_UPDATE_EVERY: 1
    EMA_WARMUP_ITERS: 2080

    HARD_NEGATIVE_MINING: False

    HNM_NEG_PER_NODE: null
    HNM_MAX_NEG_PER_SAMPLE: null
    HNM_NEG_WEIGHT_MAX: 2.0
    HNM_NEG_WEIGHT_TEMP: 1.0
    HNM_NEG_WEIGHT_THRESHOLD: 0.4
    HNM_WEIGHT_WARMUP_EPOCHS: 10
    HNM_WEIGHT_RAMP_EPOCHS: 30

    USE_SUPCL: false
    W_SUPCL: 0.1
    SUPCL_TAU: 0.3
    SUPCL_LAMBDA: 0.5
    SUPCL_PROJ_DIM: 128
    SUPCL_MAX_NODES: 200
    SUPCL_WARMUP_EPOCHS: 10

    LR_SCHEDULER.NAME: "cosine"
    LR_SCHEDULER.DECAY_EPOCHS: 30
    LR_SCHEDULER.DECAY_RATE: 0.1

    OPTIMIZER.NAME: "adamw"
    OPTIMIZER.EPS: 1e-8
    OPTIMIZER.BETAS: (0.9, 0.999)
    OPTIMIZER.MOMENTUM: 0.9

    SAVE_PATH: "/data/scavone/cross-dim_i2g_3d"
    VAL_INTERVAL: 5
    SAVE_VAL: False

    LOSSES: ["boxes", "class", "cards", "nodes", "edges", "domain"]
    W_BBOX: 3.0
    W_CLASS: 4.0
    W_CARD: 0.8
    W_NODE: 2.0
    W_EDGE: 6.0
    W_DOMAIN: 1.0

log:
    exp_name: "pretrain_plants_synthmri_supcl"
    message: "3D pretraining with SupCL: plants + syntheticMRI"
